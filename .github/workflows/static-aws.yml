# www.aihavit.com (홈 + /blog) 정적 빌드 → S3 + CloudFront.
#
# main 에 홈·블로그·정적 빌드 파일이 머지되면 자동 배포한다. 수동 실행(workflow_dispatch)도 된다.
# 소셜(apps/social) 만 바뀐 머지는 배포하지 않는다.
# AWS_DEPLOY_ROLE_ARN 시크릿이 없으면 빌드·엣지 대조만 하고 배포는 건너뛴다.
# 역할·인프라: apps/static-site/infra/cloudfront.yml, 절차: docs/static-aws-migration.md
name: static-aws

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/blog/**'
      - 'apps/static-site/**'
      - '.github/workflows/static-aws.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '배포 명령만 출력(AWS 에 쓰지 않음)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # GitHub OIDC → IAM 역할

concurrency:
  group: static-aws
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    # 캐시 없는 첫 빌드는 이미지 인코딩(원본 약 400개 → 변환 약 3,000개)만 40분+ 걸린다(11/9 실측, 45분 제한에 걸려 취소).
    timeout-minutes: 150
    env:
      HAS_ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
      STACK: havit-www-static
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # IndexNow 단계가 이번 푸시에서 바뀐 글을 git diff 로 찾는다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci --prefix apps/web --no-audit --no-fund
          npm ci --prefix apps/blog --no-audit --no-fund
          npm ci --prefix apps/static-site --no-audit --no-fund
      # 복원과 저장을 나눈다 — 빌드가 실패·취소돼도 그때까지 인코딩한 이미지를 저장해 다음 실행이 이어서 한다.
      # 키는 실행마다 새로(run_id) — 캐시 키는 덮어쓸 수 없어서, 고정 키면 반쯤 찬 캐시가 굳는다. 복원은 접두어로 가장 최근 것.
      - name: Restore image cache (originals + encoded variants)
        id: imgcache
        uses: actions/cache/restore@v4
        with:
          path: apps/static-site/.cache
          key: static-img-v2-${{ github.run_id }}
          restore-keys: |
            static-img-v2-
            static-img-v1-
      # 캐시와 상관없이 늘 지난 배포가 S3 에 올린 이미지를 씨앗으로 받는다(build.mjs IMG_SEED_DIR). 다시 인코딩하는 건 새 이미지뿐.
      # (11/9: 취소된 실행이 반쯤 찬 캐시를 정확한 키로 저장 → 다음 실행이 '캐시 있음'으로 씨앗을 건너뛰고 다시 인코딩했다)
      - name: AWS credentials for image seed (OIDC)
        if: env.HAS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Seed images from S3
        if: env.HAS_ROLE == 'true'
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='Bucket'].OutputValue" --output text)
          mkdir -p "$RUNNER_TEMP/img-seed"
          aws s3 sync "s3://$BUCKET/blog/_img/" "$RUNNER_TEMP/img-seed/" --only-show-errors
          echo "seed files: $(find "$RUNNER_TEMP/img-seed" -type f | wc -l)"
          echo "IMG_SEED_DIR=$RUNNER_TEMP/img-seed" >> "$GITHUB_ENV"
      - name: Build
        # 잡 제한(150분)보다 먼저 끊어서 아래 캐시 저장 단계가 반드시 돌게 한다.
        timeout-minutes: 130
        working-directory: apps/static-site
        run: node scripts/build.mjs
      - name: Save image cache
        if: always()
        continue-on-error: true # 씨앗으로 다 채우면 .cache 가 비어 있을 수 있다
        uses: actions/cache/save@v4
        with:
          path: apps/static-site/.cache
          key: static-img-v2-${{ github.run_id }}
      - name: Edge function ↔ middleware.js / next.config.js parity
        working-directory: apps/static-site
        run: node scripts/test-edge.mjs
      - name: AWS credentials (OIDC)
        if: env.HAS_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy (S3 sync · KVS · function · invalidation)
        if: env.HAS_ROLE == 'true'
        working-directory: apps/static-site
        run: node scripts/deploy.mjs --stack "$STACK" ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: IndexNow (바뀐 글만 Bing·네이버에 알림)
        if: env.HAS_ROLE == 'true' && github.event_name == 'push'
        working-directory: apps/static-site
        run: node scripts/indexnow-changed.mjs "${{ github.event.before }}" "${{ github.sha }}"
      - name: Skipped deploy
        if: env.HAS_ROLE != 'true'
        run: echo "AWS_DEPLOY_ROLE_ARN 시크릿이 없어 배포를 건너뛴다(빌드·대조만)."
      # 실패 알림: Actions 화면 요약 + (SLACK_DEPLOY_WEBHOOK 시크릿이 있으면) Slack.
      - name: Notify failure
        if: failure() || cancelled()
        env:
          WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MSG="❌ www.aihavit.com AWS 배포 실패 — 사이트는 이전 배포 그대로. ${GITHUB_SHA::7} ${RUN_URL}"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$WEBHOOK" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' --data "$(jq -n --arg t "$MSG" '{text:$t}')" "$WEBHOOK" || true
          fi
