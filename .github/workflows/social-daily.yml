# 매일 23:00 KST: 다음 날(UTC) 하루치 SNS 초안 생성 → 검사 → 이미지 → AI 리뷰 → 사람 검토 이슈 → 요약
name: social-daily
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '생성할 날짜(YYYY-MM-DD, 비우면 내일)'
        required: false
permissions:
  contents: read
  issues: write
concurrency:
  group: social-queue
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    # 긴급 중지: 레포 Settings → Variables 에서 SOCIAL_PAUSED=true
    if: ${{ vars.SOCIAL_PAUSED != 'true' }}
    env:
      SOCIAL_MEDIA_BUCKET: havit-prod-us-east
      SOCIAL_MEDIA_PREFIX: image/sns
      QUEUE_S3: s3://havit-prod-us-east/social-queue/
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 구독(Claude Code CLI)으로 청구 — 토큰 시크릿이 없으면 API 키로 돈다
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SOCIAL_LLM: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'cli' || 'api' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GH_TOKEN: ${{ github.token }}
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code CLI 설치(구독 호출용)
        run: npm i -g @anthropic-ai/claude-code@2.1.310
      - run: npm ci
        working-directory: apps/social
      # host.mjs 가 카드 PNG→JPEG 변환에 ImageMagick(convert)을 쓴다. 러너에 기본 설치가 아니라서 2026-10-25 첫 실행이 여기서 멈췄다.
      # 일본어 웹폰트가 러너에서 로딩 실패(2026-10-25 일본어 8건 반려) → 설치본 Noto CJK 를 대체로.
      - name: ImageMagick·Noto CJK 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick fonts-noto-cjk
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: 큐 내려받기(S3 비공개 경로 — 공개 레포라 큐는 git 에 두지 않음)
        working-directory: apps/social
        run: aws s3 sync "$QUEUE_S3" queue/ --only-show-errors
      - name: 하루치 생성
        working-directory: apps/social
        run: |
          DATE="${{ inputs.date }}"; [ -z "$DATE" ] && DATE=$(date -u -d '+1 day' +%F)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          node plan.mjs "$DATE"
          # 상황별 시리즈(미리 만들지 않은 날만 — 이미 만든 초안은 generate 가 건너뜀)
          node plan_series.mjs "$DATE"
          [ -f "queue/plan-series-$DATE.json" ] && node generate.mjs "queue/plan-series-$DATE.json" --date "$DATE"
          node generate.mjs "queue/plan-$DATE.json" --date "$DATE"
          node imagery.mjs "queue/$DATE"
          node render.mjs "queue/$DATE"
          node host.mjs "queue/$DATE"
          node reviewer.mjs "queue/$DATE"
          # 리뷰어가 돌려보낸 초안은 1회 고쳐 쓰고 다시 검수
          node revise.mjs "queue/$DATE"
          node render.mjs "queue/$DATE" --pending
          node host.mjs "queue/$DATE"
          node reviewer.mjs "queue/$DATE"
          # 2번째 고쳐 쓰기(그래도 미통과면 반려)
          node revise.mjs "queue/$DATE"
          node render.mjs "queue/$DATE" --pending
          node host.mjs "queue/$DATE"
          node reviewer.mjs "queue/$DATE"
          node escalate.mjs "queue/$DATE"
          node digest.mjs "queue/$DATE"
      - name: 큐 올리기
        if: always()
        working-directory: apps/social
        # 이 실행이 만든 날짜 폴더·계획만 올린다(미리 만든 다른 날짜를 옛 사본으로 덮지 않게).
        run: |
          [ -n "$DATE" ] || exit 0
          aws s3 sync "queue/$DATE/" "${QUEUE_S3}$DATE/" --only-show-errors --exclude "*.html"
          for f in queue/plan-$DATE.json queue/plan-series-$DATE.json; do [ -f "$f" ] && aws s3 cp "$f" "${QUEUE_S3}$(basename "$f")" --only-show-errors; done; true 
