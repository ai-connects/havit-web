<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <title>Page not found — HAVIT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#fff; --fg:#111; --sub:#666; --line:#e5e5e5; --btn:#111; --btnfg:#fff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#f2f2f2; --sub:#a0a0a0; --line:#333; --btn:#f2f2f2; --btnfg:#111; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif; padding:24px 16px; }
    main { max-width:520px; text-align:center; }
    img { height:28px; margin-bottom:32px; }
    h1 { font-size:28px; margin:0 0 8px; }
    p { color:var(--sub); margin:0 0 4px; line-height:1.5; }
    nav { margin-top:28px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
    a { color:var(--fg); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:10px 18px; font-size:15px; }
    a.primary { background:var(--btn); color:var(--btnfg); border-color:var(--btn); }
  </style>
</head>
<body>
  <main>
    <img src="/havit-logo.svg" alt="HAVIT" />
    <h1>Page not found</h1>
    <p>The page you’re looking for doesn’t exist or has moved.</p>
    <p lang="ko">찾으시는 페이지가 없거나 주소가 바뀌었어요.</p>
    <nav>
      <a class="primary" href="/">HAVIT home</a>
      <a href="/blog/en">Blog</a>
      <a href="/ko/" lang="ko">한국어 홈</a>
      <a href="/blog/ko" lang="ko">블로그</a>
    </nav>
  </main>
</body>
</html>
